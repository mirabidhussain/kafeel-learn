name: Build My Expenses APK
on:
  push:
    branches: [main]
    paths: ['expenses/**', '.github/workflows/expenses.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bundle the app into the Android assets
        run: |
          mkdir -p expenses/android/app/src/main/assets
          cp expenses/index.html expenses/android/app/src/main/assets/
      - name: Build APK
        working-directory: expenses/android
        run: gradle assembleDebug --no-daemon
      - run: cp expenses/android/app/build/outputs/apk/debug/app-debug.apk MyExpenses.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyExpenses-apk
          path: MyExpenses.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete expenses-latest --yes --cleanup-tag || true
          gh release create expenses-latest MyExpenses.apk --latest=false --title "My Expenses (Android)" \
            --notes "Fully offline expenses app. Download MyExpenses.apk on the phone and open it to install."
