name: Build Android APK
on:
  push:
    branches: [main]
    paths-ignore: ['expenses/**', '.github/workflows/expenses.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Download the app font (bundled so the app works offline)
        run: |
          mkdir -p /tmp/font && cd /tmp/font
          npm pack @fontsource/baloo-2
          tar xzf fontsource-baloo-2-*.tgz
      - name: Bundle the web app into the Android assets (fully offline)
        run: python3 tools/make_offline.py /tmp/font/package/files
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KafeelLearn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KafeelLearn-apk
          path: KafeelLearn.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest KafeelLearn.apk --latest --title "Kafeel's Learn & Practice (Android)" \
            --notes "Fully offline app - no internet or browser needed after install. Download KafeelLearn.apk on the Android phone and open it to install. Allow 'Install unknown apps' if Android asks."
