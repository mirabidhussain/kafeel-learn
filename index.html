<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kafeel's Learn &amp; Practice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b61ff">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#e9f6ff; --ink:#24324a; --soft:#5d6b82;
    --math:#ff8a3d; --math-d:#e2671a; --sci:#2bb673; --sci-d:#1c9259;
    --sun:#ffd23f; --berry:#ff5d8f; --grape:#7b61ff; --card:#ffffff;
    --good:#2bb673; --bad:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#bfe6ff 0%,var(--sky) 45%,#fff8e6 100%);
    min-height:100%;overflow-x:hidden;user-select:none;
  }
  .wrap{max-width:720px;margin:0 auto;padding:16px 16px 40px;min-height:100vh;position:relative}
  .screen{display:none;animation:pop .35s ease}
  .screen.on{display:block}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .stars{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:20px;box-shadow:0 3px 0 #0001}
  .hello{text-align:center;margin:6px 0 2px}
  .hello h1{font-size:40px;line-height:1;margin:0;color:var(--grape);text-shadow:0 3px 0 #fff}
  .hello p{margin:4px 0 0;color:var(--soft);font-size:18px}
  .mascot{font-size:64px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}

  .age{display:flex;background:#fff;border-radius:18px;padding:5px;margin:14px auto;max-width:420px;box-shadow:0 4px 0 #0001}
  .age button{flex:1;border:0;background:transparent;font:inherit;font-size:17px;font-weight:700;padding:10px 6px;border-radius:14px;color:var(--soft);cursor:pointer}
  .age button.on{background:var(--grape);color:#fff}

  .world{border-radius:26px;padding:14px;margin:16px 0;box-shadow:0 6px 0 #0001}
  .world.math{background:#fff1e6}
  .world.sci{background:#e6f8ef}
  .world h2{margin:0 0 10px;font-size:26px;display:flex;align-items:center;gap:8px}
  .world.math h2{color:var(--math-d)} .world.sci h2{color:var(--sci-d)}
  .games{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .game{border:0;font:inherit;background:#fff;border-radius:20px;padding:14px 10px;cursor:pointer;
    box-shadow:0 5px 0 #0002;transition:transform .1s;text-align:center;color:var(--ink)}
  .game:active{transform:translateY(4px);box-shadow:0 1px 0 #0002}
  .game .ic{font-size:44px;display:block}
  .game b{display:block;font-size:19px;line-height:1.1;margin-top:4px}
  .game small{color:var(--soft);font-size:14px}
  .game .best{display:block;font-size:14px;margin-top:2px;min-height:18px}

  /* play screen */
  .back{border:0;background:#fff;font:inherit;font-weight:800;font-size:18px;border-radius:14px;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 #0002}
  .progress{flex:1;height:16px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 #0001}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--berry));transition:width .4s}
  .stage{background:#fff;border-radius:28px;padding:18px 14px 20px;margin-top:12px;box-shadow:0 6px 0 #0001;text-align:center;position:relative}
  .q{font-size:26px;font-weight:800;margin:0 0 6px;line-height:1.15}
  .speak{border:0;background:#f0edff;border-radius:999px;font-size:20px;padding:4px 12px;cursor:pointer;margin-bottom:6px}
  .show{min-height:120px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;
        font-size:44px;line-height:1.1;padding:8px;margin:6px 0 10px;background:#f7fbff;border-radius:20px}
  .show .big{font-size:64px}
  .show .num{font-size:56px;font-weight:800;color:var(--grape)}
  .show .op{font-size:48px;font-weight:800;color:var(--berry);margin:0 4px}
  .grp{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:46%;padding:8px;border-radius:16px;background:#fff;border:3px dashed #dfe7f2}
  .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .opts.three{grid-template-columns:repeat(3,1fr)}
  .opt{border:0;font:inherit;font-size:30px;font-weight:800;background:var(--sun);color:var(--ink);border-radius:20px;
       padding:14px 6px;min-height:76px;cursor:pointer;box-shadow:0 6px 0 #d9ad12;transition:transform .08s}
  .opt small{display:block;font-size:16px;font-weight:700}
  .opt:active{transform:translateY(5px);box-shadow:0 1px 0 #d9ad12}
  .opt.right{background:var(--good);color:#fff;box-shadow:0 6px 0 #1c9259;animation:yay .5s}
  .opt.wrong{background:var(--bad);color:#fff;box-shadow:0 6px 0 #d64545;animation:shake .4s}
  .opt:disabled{cursor:default}
  @keyframes yay{40%{transform:scale(1.12)}}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .fact{min-height:28px;margin-top:12px;font-size:19px;font-weight:700;color:var(--sci-d)}
  .fact.oops{color:#d64545}

  /* end */
  .end{text-align:center;padding-top:20px}
  .end .trophy{font-size:96px;animation:bob 2s ease-in-out infinite}
  .end h2{font-size:38px;margin:4px 0;color:var(--grape)}
  .end .earned{font-size:46px;letter-spacing:4px}
  .btn{border:0;font:inherit;font-weight:800;font-size:22px;border-radius:20px;padding:14px 26px;margin:8px;cursor:pointer;color:#fff}
  .btn.go{background:var(--sci);box-shadow:0 6px 0 var(--sci-d)}
  .btn.home{background:var(--grape);box-shadow:0 6px 0 #5a43d6}

  .confetti{position:fixed;top:-20px;font-size:26px;pointer-events:none;animation:fall linear forwards;z-index:9}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  .world.code{background:#efeaff}
  .world.code h2{color:#5a43d6}
  .opts.list{grid-template-columns:1fr}
  .opts.list .opt{text-align:left;padding:10px 12px;font-size:18px}
  .prog{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}
  .blk{border-radius:8px;padding:4px 12px;font-size:17px;color:#fff;font-weight:700;line-height:1.3;box-shadow:0 2px 0 #0002}
  .blk.ev{background:#ffbf00;color:#3a2a00;border-radius:16px 16px 8px 8px}
  .blk.mv{background:#4c97ff} .blk.lk{background:#9966ff} .blk.ct{background:#ffab19;color:#3a2a00}
  .loop{border-left:12px solid #ffab19;padding:3px 0 3px 6px;display:flex;flex-direction:column;gap:3px;border-radius:0 0 0 8px}
  .grid{display:grid;gap:4px;background:#d9f2d9;padding:6px;border-radius:14px}
  .grid div{width:52px;height:52px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:34px}
  .tens{display:flex;gap:6px;align-items:flex-end}
  .ten{display:grid;grid-template-rows:repeat(10,9px);gap:1px;background:#2b7bff;padding:2px;border-radius:4px}
  .ten i{width:14px;background:#7fb2ff;border-radius:2px}
  .one{width:16px;height:16px;background:#ff8a3d;border-radius:3px;display:inline-block;margin:2px}
  .coin{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#e0b23a 60%,#b8871a);
        display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#5a3d00;box-shadow:0 3px 0 #8a6510}
  .coin.big{width:70px;height:70px;background:radial-gradient(circle at 35% 30%,#f4f4f4,#b9c0c8 60%,#7e8790);color:#333;box-shadow:0 3px 0 #59606a}
  .lesson{text-align:left}
  .lesson #lBody{font-size:21px;line-height:1.45}
  .lesson .ex{font-size:42px;text-align:center;background:#f7fbff;border-radius:18px;padding:10px;margin:10px 0;line-height:1.25}
  .lesson .ex small{display:block;font-size:20px;color:var(--soft);font-weight:700}
  .lesson .tip{background:#fff7d6;border-radius:14px;padding:8px 12px;font-size:18px;margin-top:8px}
  .game .best{color:var(--sci-d);font-weight:800}
  .setrow{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;background:#fff;border-radius:14px;padding:4px 8px}
  .setrow span{min-width:150px;text-align:left}
  .sbtn{border:0;font:inherit;font-size:30px;font-weight:800;width:58px;height:52px;border-radius:14px;background:#efeaff;color:#5a43d6;box-shadow:0 4px 0 #cfc6ff;cursor:pointer}
  .sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #cfc6ff}
  .foot{text-align:center;color:var(--soft);font-size:14px;margin-top:20px}
  .sndbtn{border:0;background:#fff;border-radius:999px;font-size:20px;padding:6px 12px;cursor:pointer;box-shadow:0 3px 0 #0001}
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME -->
  <section class="screen on" id="home">
    <div class="top">
      <button class="sndbtn" id="snd" aria-label="Sound on or off">🔊</button>
      <div class="stars">📘 <span id="starCount">0</span> done</div>
    </div>
    <div class="hello">
      <span class="mascot">🦉</span>
      <h1>Learn &amp; Practice</h1>
      <p id="greet">Pick a game and collect stars!</p>
    </div>
    <div class="age" role="tablist">
      <button data-age="little">🐣 Little (3–5)</button>
      <button data-age="big" class="on">🚀 Big (6–9)</button>
    </div>

    <div class="world math">
      <h2>🔢 Maths</h2>
      <div class="games" id="mathGames"></div>
    </div>
    <div class="world code">
      <h2>🧠 Logic &amp; Coding</h2>
      <div class="games" id="codeGames"></div>
    </div>
    <div class="world sci">
      <h2>🔬 Science</h2>
      <div class="games" id="sciGames"></div>
    </div>
    <p class="foot">Each topic: read the lesson 📖 → answer 5 practice questions ✏️. Tap 🗣️ to hear it read aloud.</p>
  </section>

  <!-- LEARN -->
  <section class="screen" id="learn">
    <div class="top">
      <button class="back" id="lQuit">← Back</button>
      <div style="font-weight:800;font-size:18px" id="lCount"></div>
    </div>
    <div class="stage lesson">
      <div style="font-size:16px;font-weight:800;color:var(--grape)" id="lTopic"></div>
      <h3 id="lHead" style="font-size:28px;margin:4px 0 8px;line-height:1.15"></h3>
      <div id="lBody"></div>
      <button class="speak" id="lSay" style="margin-top:12px">🗣️ Read to me</button>
    </div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn home" id="lPrev" style="flex:1;margin:0;font-size:19px;padding:12px">◀ Back</button>
      <button class="btn go" id="lNext" style="flex:2;margin:0;font-size:19px;padding:12px">Next ▶</button>
    </div>
  </section>

  <!-- PLAY -->
  <section class="screen" id="play">
    <div class="top">
      <button class="back" id="quit">← Back</button>
      <div class="progress"><i id="bar"></i></div>
      <div class="stars">✔️ <span id="roundStars">0</span>/5</div>
    </div>
    <div class="stage">
      <p class="q" id="qText"></p>
      <button class="speak" id="say">🗣️ Hear it</button>
      <div class="show" id="qShow"></div>
      <div class="opts" id="opts"></div>
      <div class="fact" id="fact"></div>
    </div>
  </section>

  <!-- END -->
  <section class="screen" id="end">
    <div class="end">
      <div class="trophy" id="trophy">📘</div>
      <h2 id="endTitle">Great job!</h2>
      <div class="earned" id="earned"></div>
      <p id="endMsg" style="font-size:20px;color:var(--soft)"></p>
      <button class="btn go" id="again">✏️ Practise again</button><br>
      <button class="btn go" id="reread" style="background:#ff8a3d;box-shadow:0 6px 0 #e2671a">📖 Read lesson again</button><br>
      <button class="btn home" id="toHome">🏠 Home</button>
    </div>
  </section>
</div>

<script>
/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const blk=(c,t)=>`<div class="blk ${c}">${t}</div>`;
const prog=arr=>`<div class="prog">${arr.join('')}</div>`;
const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const store = {
  get(k,d){ try{ const v=localStorage.getItem('pl_'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('pl_'+k,JSON.stringify(v)); }catch(e){} }
};
function numOpts(ans,min,max,count=4){
  const s=new Set([ans]); let guard=0;
  while(s.size<count && guard++<200){ const v=ans+rnd(-3,3); if(v>=min && v<=max) s.add(v); }
  while(s.size<count){ s.add(rnd(min,max)); }
  return shuffle([...s]).map(v=>({label:String(v),value:v}));
}

/* ---------- state ---------- */
const KID='Kafeel';
let age = store.get('age','big');
let totalStars = store.get('stars',0);
let best = store.get('best',{});
let soundOn = store.get('sound',true);
let current=null, qIndex=0, roundStars=0, firstTry=true, currentQ=null;
const ROUND = 5;

/* ---------- sound (Web Audio, starts on tap) ---------- */
let ac=null;
function tone(freqs,dur=.12,type='sine'){
  return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.value=f;
      const t=ac.currentTime+i*dur;
      g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur*1.7);
    });
  }catch(e){}
}
const sGood=()=>tone([660,880,1100],.1,'triangle');
const sBad =()=>tone([300,220],.15,'sawtooth');
const sWin =()=>tone([523,659,784,1046,784,1046],.12,'triangle');
function speak(text){
  if(!soundOn) return;
  const clean=text.replace(/[^\w\s?,.!'+-]/g,'');
  try{ if(window.AndroidTTS){ AndroidTTS.speak(clean); return; } }catch(e){}
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/[^\w\s?,.!'+-]/g,'')); u.rate=.9; u.pitch=1.2; speechSynthesis.speak(u);}catch(e){}
}

/* ---------- content ---------- */
const FRUITS=['🍎','🍌','🍓','🍊','🍇','🚗','🏎️','🚙','🐞','⚽','🎈','🥇'];
const LIVING=[
 ['🐶',1,'Dogs breathe, eat and grow.'],['🌳',1,'Trees are alive! They drink water and grow.'],['🐦',1,'Birds eat, breathe and lay eggs.'],
 ['🌻',1,'Flowers grow towards the sun.'],['🐟',1,'Fish breathe with gills.'],['🐛',1,'Caterpillars grow into butterflies!'],
 ['👶',1,'Babies grow into big kids, like you!'],['🍄',1,'Mushrooms are living things too.'],['🐄',1,'Cows eat grass and give milk.'],
 ['🪨',0,'A rock does not eat, breathe or grow.'],['🚗',0,'A car moves, but it is not alive.'],['🧸',0,'Teddy is soft, but not alive.'],
 ['✏️',0,'A pencil cannot grow.'],['⚽',0,'A ball does not breathe.'],['☂️',0,'An umbrella is not alive.'],['🪑',0,'A chair is made from wood but is not living now.'],
 ['📱',0,'A phone needs a battery, not food.'],['⏰',0,'A clock ticks but does not grow.']
];
const HOMES=[
 ['🐟','water','Fish live in water and swim with fins.'],['🐳','water','Whales live in the deep sea.'],['🐙','water','An octopus has 8 arms and lives in the sea.'],
 ['🐒','tree','Monkeys swing from tree to tree.'],['🦉','tree','Owls rest in trees and wake up at night.'],['🐿️','tree','Squirrels keep nuts in trees.'],
 ['🐪','desert','Camels can go many days without water.'],['🦂','desert','Scorpions hide under desert sand.'],
 ['🐧','ice','Penguins love cold, icy places.'],['🐻‍❄️','ice','Polar bears have thick fur to stay warm.'],
 ['🐄','farm','Cows live on farms and eat grass.'],['🐓','farm','Hens on the farm lay eggs.'],['🐑','farm','Sheep give us wool.']
];
const HOME_OPTS={water:'🌊 Water',tree:'🌳 Tree',desert:'🏜️ Desert',ice:'🧊 Ice',farm:'🚜 Farm'};
const FLOAT=[
 ['🪵',1,'Wood is light, so it floats.'],['🦆',1,'Ducks float with oily feathers.'],['🍎',1,'Apples have air inside, so they float!'],
 ['⚽',1,'A ball is full of air — it floats.'],['🍃',1,'A leaf is very light and floats.'],['🛟',1,'A float ring is full of air.'],['🧽',1,'A sponge floats on water.'],
 ['🪨',0,'Rocks are heavy for their size — they sink.'],['🔑',0,'A metal key sinks.'],['🪙',0,'A coin sinks to the bottom.'],
 ['⚓',0,'An anchor sinks to hold the boat.'],['🔩',0,'A metal bolt sinks.'],['🥚',0,'A fresh egg sinks in plain water.']
];
const MATTER=[
 ['🧊','solid','Ice is solid — it keeps its shape.'],['🪨','solid','A rock is a solid.'],['🧱','solid','Bricks are solid.'],['🍎','solid','An apple is solid.'],
 ['💧','liquid','Water is a liquid — it flows.'],['🥛','liquid','Milk takes the shape of its glass.'],['🧃','liquid','Juice is a liquid.'],['🍯','liquid','Honey is a slow, thick liquid.'],
 ['💨','gas','Air is a gas — we cannot see it.'],['♨️','gas','Steam is water as a gas.'],['🎈','gas','Balloons are filled with gas.'],['🫧','gas','Bubbles hold air (a gas) inside.']
];
const MATTER_OPTS={solid:'🧱 Solid',liquid:'💧 Liquid',gas:'💨 Gas'};
const SENSES=[
 ['see','👀','Eyes','We see colours with our eyes.'],['hear','👂','Ears','We hear music with our ears.'],
 ['smell','👃','Nose','We smell flowers with our nose.'],['taste','👅','Tongue','We taste food with our tongue.'],['touch','✋','Hands','We feel soft and hard with our skin.']
];
const SENSE_THINGS={see:['🌈','📺','⭐'],hear:['🥁','🔔','🎵'],smell:['🌹','🧄','🍞'],taste:['🍭','🍋','🍦'],touch:['🧸','🌵','🧊']};
const PUSHPULL=[
 ['⚽ Kicking a ball','push','A kick is a PUSH — it moves the ball away from you.'],
 ['🪢 Tug of war','pull','Tug of war is a PULL — both teams pull the rope towards them!'],
 ['🚪 Opening a drawer','pull','You PULL a drawer towards you.'],
 ['🛒 Moving a trolley','push','You PUSH a trolley forward.'],
 ['🚗 Toy car rolling away','push','A little PUSH makes the car zoom!'],
 ['🪁 Flying a kite string','pull','You PULL the string to control the kite.'],
 ['🔔 Ringing a doorbell','push','You PUSH the button.'],
 ['🥋 Blocking a punch','push','In martial arts, a block PUSHES the force away.'],
 ['🐕 Walking a dog on a lead','pull','The dog PULLS the lead!'],
 ['🧲 Magnet picking up a pin','pull','Magnets PULL iron things towards them.']
];
const PLANETS=['☀️ Sun','Mercury','Venus','Earth 🌍','Mars','Jupiter','Saturn 🪐','Uranus','Neptune'];

/* ---------- games ---------- */
const GAMES={
 count:{world:'math',ic:'🍎',name:'Counting',sub:'Count objects',
   make(){
     const n = age==='little'? rnd(1,6) : rnd(5,15); const e=pick(FRUITS);
     return {q:`How many ${e} can you count?`, say:'How many can you count?',
       show:`<div style="max-width:420px">${(e+' ').repeat(n)}</div>`,
       opts:numOpts(n,1,age==='little'?10:20), ans:n,
       fact:`Yes! There are ${n}.`};
   }},
 add:{world:'math',ic:'➕',name:'Add & Subtract',sub:'Plus and minus',
   make(){
     if(age==='little'){
       const a=rnd(1,4), b=rnd(1,5-a+1>0?Math.max(1,5-a):1), e=pick(FRUITS);
       return {q:`${a} + ${b} = ?`, say:`${a} plus ${b} makes how many?`,
         show:`<span>${e.repeat(a)}</span><span class="op">+</span><span>${e.repeat(b)}</span>`,
         opts:numOpts(a+b,1,10), ans:a+b, fact:`${a} and ${b} make ${a+b}!`};
     }
     const plus=Math.random()<.55;
     let a=rnd(3,15), b=rnd(1,9); if(!plus && b>a) [a,b]=[b,a];
     const ans= plus? a+b : a-b;
     return {q:`${a} ${plus?'+':'−'} ${b} = ?`, say:`${a} ${plus?'plus':'minus'} ${b}`,
       show:`<span class="num">${a}</span><span class="op">${plus?'+':'−'}</span><span class="num">${b}</span><span class="op">=</span><span class="num">?</span>`,
       opts:numOpts(ans,0,30), ans, fact:`${a} ${plus?'+':'−'} ${b} = ${ans}. Super!`};
   }},
 more:{world:'math',ic:'⚖️',name:'More & Less',sub:'Compare numbers',

 robot:{world:'code',ic:'🤖',name:'Coding: Directions',sub:'Scratch-style blocks',

 planets:[{h:'Our Solar System',b:'Eight planets go round the Sun. In order:'+ex('<div style="font-size:20px">☀️ Mercury → Venus → Earth 🌍 → Mars → Jupiter → Saturn 🪐 → Uranus → Neptune</div>')+tip('Remember: "My Very Educated Mother Just Served Us Noodles".')}]

function clockSVG(h,m,size=170){
  const c=60, ang=(d)=>(d-90)*Math.PI/180;
  const hand=(deg,len,w,col)=>`<line x1="${c}" y1="${c}" x2="${(c+len*Math.cos(ang(deg))).toFixed(1)}" y2="${(c+len*Math.sin(ang(deg))).toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
  let nums=''; for(let i=1;i<=12;i++){ const a=ang(i*30); nums+=`<text x="${(c+44*Math.cos(a)).toFixed(1)}" y="${(c+44*Math.sin(a)+4.5).toFixed(1)}" font-size="13" font-weight="800" text-anchor="middle" fill="#24324a" font-family="Baloo 2,sans-serif">${i}</text>`; }
  let ticks=''; for(let i=0;i<60;i++){ const a=ang(i*6), r1=i%5?53:50; ticks+=`<line x1="${(c+r1*Math.cos(a)).toFixed(1)}" y1="${(c+r1*Math.sin(a)).toFixed(1)}" x2="${(c+56*Math.cos(a)).toFixed(1)}" y2="${(c+56*Math.sin(a)).toFixed(1)}" stroke="#9aa6b8" stroke-width="${i%5?0.8:1.6}"/>`; }
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120"><circle cx="60" cy="60" r="58" fill="#fff" stroke="#7b61ff" stroke-width="4"/>${ticks}${nums}
    ${hand((h%12)*30+m*0.5,28,6,'#ff5d8f')}${hand(m*6,42,3.5,'#2b7bff')}<circle cx="60" cy="60" r="4" fill="#24324a"/></svg>`;
}
let SC={t:720};
function drawSet(){ const hh=Math.floor(SC.t/60)%12||12, mm=SC.t%60; const f=document.getElementById('setFace'); if(f) f.innerHTML=clockSVG(hh,mm,190); }
function moveSet(d,hourOnly){ SC.t=((SC.t+d)%720+720)%720; drawSet(); }
function setValue(){ const hh=Math.floor(SC.t/60)%12||12, mm=SC.t%60; return hh+':'+mm; }
const timeName=(h,m)=> m===0?`${h} o'clock`: m===30?`half past ${h}`: m===15?`quarter past ${h}`:`quarter to ${h%12+1}`;
const digital=(h,m)=>`${h}:${String(m).padStart(2,'0')}`;

/* ---------- home ---------- */
function renderHome(){
  $('starCount').textContent=Object.keys(best).filter(k=>k.startsWith(age+'_')).length;
  document.querySelectorAll('.age button').forEach(b=>b.classList.toggle('on',b.dataset.age===age));
  $('snd').textContent=soundOn?'🔊':'🔇';
  $('greet').textContent=`Hi ${KID}! 👋 Pick a topic to learn today.`;
  ['math','code','sci'].forEach(w=>{
    const box=$({math:'mathGames',code:'codeGames',sci:'sciGames'}[w]); box.innerHTML='';
    Object.entries(GAMES).forEach(([id,g])=>{
      if(g.world!==w) return;
      if(g.bigOnly && age==='little') return;
      if(id==='senses' && age==='big') return;
      const b=best[age+'_'+id];
      const btn=document.createElement('button'); btn.className='game';
      btn.innerHTML=`<span class="ic">${g.ic}</span><b>${g.name}</b><small>${g.sub}</small><span class="best">${b!==undefined?`✓ Done · ${b}/5`:''}</span>`;
      btn.onclick=()=>openLesson(id); box.appendChild(btn);
    });
  });
}
document.querySelectorAll('.age button').forEach(b=>b.onclick=()=>{ age=b.dataset.age; store.set('age',age); tone([500,700]); renderHome(); });
$('snd').onclick=()=>{ soundOn=!soundOn; store.set('sound',soundOn); renderHome(); tone([600]); };

function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); window.scrollTo(0,0); }

/* ---------- play ---------- */
function start(id){ current=id; qIndex=0; roundStars=0; $('roundStars').textContent=0; show('play'); next(); }
function lessonFor(id){ const L=LESSONS[id]||[]; return (id==='time'&&age==='little')? [L[0],L[1],L[4]] : L; }
function openLesson(id){ current=id; slide=0; show('learn'); renderSlide(); }
let slide=0;
function renderSlide(){
  const L=lessonFor(current); const sl=L[slide];
  $('lTopic').textContent=GAMES[current].ic+' '+GAMES[current].name;
  $('lCount').textContent=`📖 Lesson ${slide+1} of ${L.length}`;
  $('lHead').textContent=sl.h; $('lBody').innerHTML=sl.b;
  $('lPrev').style.visibility= slide===0?'hidden':'visible';
  $('lNext').textContent= slide===L.length-1?'✏️ Start practice':'Next ▶';
  window.scrollTo(0,0);
  speak(sl.h+'. '+$('lBody').innerText);
}
$('lNext').onclick=()=>{ const L=lessonFor(current); if(slide<L.length-1){slide++;renderSlide();} else start(current); };
$('lPrev').onclick=()=>{ if(slide>0){slide--;renderSlide();} };
$('lQuit').onclick=()=>{ try{speechSynthesis.cancel();}catch(e){} renderHome(); show('home'); };
$('lSay').onclick=()=>{ const was=soundOn; soundOn=true; speak($('lHead').textContent+'. '+$('lBody').innerText); soundOn=was; };
function next(){
  if(qIndex>=ROUND) return finish();
  $('bar').style.width=(qIndex/ROUND*100)+'%';
  currentQ=GAMES[current].make(); firstTry=true;
  $('qText').textContent=currentQ.q;
  $('qShow').innerHTML=currentQ.show;
  $('fact').textContent=''; $('fact').className='fact';
  const o=$('opts'); o.innerHTML='';
  o.className='opts'+(currentQ.list?' list':(currentQ.three||currentQ.opts.length===3)?' three':'');
  currentQ.opts.forEach(op=>{
    const b=document.createElement('button'); b.className='opt'; b.innerHTML=op.label;
    b.onclick=()=>answer(b,op.value==='__check'?setValue():op.value); o.appendChild(b);
  });
  if(currentQ.init) currentQ.init();
  o.className=o.className+(currentQ.set?' list':'');
  speak(currentQ.say||currentQ.q);
}
function answer(btn,val){
  if(val===currentQ.ans){
    btn.classList.add('right'); sGood();
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    if(firstTry){ roundStars++; $('roundStars').textContent=roundStars; }
    $('fact').textContent='✅ '+currentQ.fact; speak(currentQ.fact);
    qIndex++; $('bar').style.width=(qIndex/ROUND*100)+'%';
    setTimeout(next,1700);
  } else {
    btn.classList.add('wrong'); btn.disabled=true; sBad(); firstTry=false;
    if(currentQ.set){ setTimeout(()=>{btn.classList.remove('wrong');btn.disabled=false;},700); $('fact').className='fact oops'; $('fact').textContent='Not yet — check the short hand and the long hand 🙂'; return; }
    $('fact').className='fact oops'; $('fact').textContent=pick(['Try again! 💪','Almost! Have another go 🙂','Oops — look again 👀']);
  }
}
function finish(){
  const key=age+'_'+current; best[key]=roundStars; store.set('best',best);
  $('earned').textContent=`${roundStars} / ${ROUND}`;
  $('trophy').textContent='📘';
  $('endTitle').textContent= roundStars>=4?`Well done, ${KID}!`: roundStars>=2?`Good work, ${KID}!`:`Keep practising, ${KID}!`;
  $('endMsg').textContent= roundStars>=4?`You got ${roundStars} of ${ROUND} right first time. You understand ${GAMES[current].name}!`
     :`You got ${roundStars} of ${ROUND} right first time. Read the lesson again, then practise once more.`;
  show('end'); sWin(); speak($('endTitle').textContent); confetti();
}
function confetti(){ return;
  const bits=['🎉','⭐','🎈','✨','🌟','🍬'];
  for(let i=0;i<28;i++){
    const s=document.createElement('div'); s.className='confetti'; s.textContent=pick(bits);
    s.style.left=rnd(0,100)+'vw'; s.style.animationDuration=(rnd(18,35)/10)+'s'; s.style.animationDelay=(rnd(0,8)/10)+'s';
    document.body.appendChild(s); setTimeout(()=>s.remove(),5000);
  }
}
$('say').onclick=()=>{ const was=soundOn; soundOn=true; speak(currentQ.say||currentQ.q); soundOn=was; };
$('quit').onclick=()=>{ try{speechSynthesis.cancel();}catch(e){} renderHome(); show('home'); };
$('again').onclick=()=>start(current);
$('reread').onclick=()=>openLesson(current);
$('toHome').onclick=()=>{ renderHome(); show('home'); };

renderHome();
if('serviceWorker' in navigator && location.protocol==='https:'){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
</script>
